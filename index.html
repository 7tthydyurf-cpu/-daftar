<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الحسابات</title>
<style>
:root{--bar:#00a8e8;--bg:#f5f7f8;--card:#fff;--tx:#17212b;--mu:#6b7885;--ln:#e1e6ea;--on:#c0392b;--onb:#fbe3df;--fr:#1e8e5a;--frb:#dcf3e8;--ac:#00a8e8;--sh:rgba(0,0,0,.45);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#0b5f82;--bg:#12181d;--card:#1b242b;--tx:#e8eef2;--mu:#93a1ad;--ln:#2a353d;--on:#ff8a7a;--onb:#3b2320;--fr:#5ed39a;--frb:#17352a;--ac:#4cc3f0}}
:root[data-theme="dark"]{--bar:#0b5f82;--bg:#12181d;--card:#1b242b;--tx:#e8eef2;--mu:#93a1ad;--ln:#2a353d;--on:#ff8a7a;--onb:#3b2320;--fr:#5ed39a;--frb:#17352a;--ac:#4cc3f0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{background:var(--bar);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{flex:1;font-size:19px;margin:0 6px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px}
.ib:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar2{display:flex;gap:8px;align-items:center;padding:10px 12px}
.chip{background:var(--bar);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
.cnt{color:var(--ac);font-weight:700;margin-inline-start:auto}
main{flex:1;padding:0 12px 12px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .nm{flex:1;font-weight:600;text-align:start;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--bar);color:#fff;border-radius:6px;min-width:30px;text-align:center;padding:2px 8px;font-weight:700}
.amt{min-width:70px;text-align:center;font-weight:700;font-size:18px}
.on{color:var(--on)}.fr{color:var(--fr)}
.chev{width:34px;height:30px;border-radius:7px;color:#fff;display:grid;place-items:center}
.chev.on{background:var(--on);color:#fff}.chev.fr{background:var(--fr);color:#fff}
.plus{color:var(--ac);font-size:26px;width:36px;height:36px}
.foot{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--ln);padding:10px 12px;display:flex;align-items:center;gap:10px}
.tot{flex:1;background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:600;line-height:1.7}
.tot div{display:flex;justify-content:space-between}
.fab{width:48px;height:48px;border-radius:50%;background:var(--bar);color:#fff;font-size:28px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;text-align:center}
th{background:var(--bar);color:#fff;padding:8px;font-weight:600}
th:first-child{border-radius:0 8px 8px 0}th:last-child{border-radius:8px 0 0 8px}
td{padding:9px 6px;background:var(--card);font-weight:600;font-size:15px}
td.d{font-size:12px;color:var(--mu)}td.n{font-weight:400;font-size:13px;color:var(--mu);word-break:break-word}
td.b{border-radius:8px 0 0 8px}
td.a span,td.b span{display:block;border-radius:4px;padding:14px 2px;font-size:20px;font-weight:700}
.o span{background:#fa8072;color:#111}.f span{background:#78c98e;color:#111}
small{font-size:11px;font-weight:600}
.lockscr{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lockscr input{max-width:280px;text-align:center}
.empty{text-align:center;color:var(--mu);padding:50px 20px;line-height:1.9}
.ov{position:fixed;inset:0;background:var(--sh);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:440px;padding:14px;max-height:92vh;overflow:auto}
.dlg h2{margin:0 0 12px;background:var(--bar);color:#fff;border-radius:8px;padding:10px;text-align:center;font-size:17px}
.dlg label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--ln);font-weight:700}
.seg .s-on.sel{border-color:var(--on);background:var(--onb);color:var(--on)}
.seg .s-fr.sel{border-color:var(--fr);background:var(--frb);color:var(--fr)}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;padding:11px;border-radius:10px;font-weight:700;background:var(--bar);color:#fff}
.acts .gh{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.acts .dg{background:var(--on);color:#fff}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(78vw,300px);background:var(--card);z-index:30;box-shadow:0 0 30px var(--sh)}
.drawer .hd{background:var(--bar);color:#fff;padding:36px 16px 20px;font-size:20px;font-weight:700}
.drawer button{display:block;width:100%;text-align:start;padding:14px 18px;font-size:16px;border-bottom:1px solid var(--ln)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:40;font-size:14px}

:root{--b1:#27b9f2;--b3:#0093cf;--b4:#0079ab}
@supports (color:color-mix(in srgb,red,blue)){:root{--b1:color-mix(in srgb,var(--bar) 82%,#fff);--b3:color-mix(in srgb,var(--bar) 85%,#000);--b4:color-mix(in srgb,var(--bar) 62%,#000)}}
:root{--g:linear-gradient(180deg,var(--b1),var(--bar) 55%,var(--b3));--gr:linear-gradient(180deg,#ff9488,#fa8072 55%,#ea6d60);--gg:linear-gradient(180deg,#8fdca4,#78c98e 55%,#62b87a)}
body{font-family:Cairo,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.ic{width:1.15em;height:1.15em;vertical-align:middle;flex:none}
header{background:var(--g);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -4px rgba(0,50,90,.5)}
.ib{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}.ib:active{background:rgba(0,0,0,.18)}
.row{border:0;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.14),0 10px 18px -8px rgba(10,40,70,.4)}
.row:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 rgba(0,0,0,.14),0 4px 8px -4px rgba(10,40,70,.4)}
.badge{background:var(--g);border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 var(--b4),0 5px 8px -3px rgba(0,60,100,.5)}
.chev{border-radius:9px;color:#111;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 rgba(0,0,0,.28),0 6px 10px -3px rgba(0,0,0,.4)}
.chev.on{background:var(--gr);color:#111}.chev.fr{background:var(--gg);color:#111}
.plus{filter:drop-shadow(0 2px 2px rgba(0,60,100,.35))}
.chip{background:var(--g);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 var(--b4),0 6px 10px -4px rgba(0,60,100,.45)}
th{background:var(--g);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 var(--b4)}
td.a span,td.b span{border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.08),0 3px 0 rgba(0,0,0,.24),0 7px 10px -4px rgba(0,0,0,.4)}
.o span{background:var(--gr)}.f span{background:var(--gg)}
.fab{width:54px;height:54px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,var(--b1),var(--bar) 55%,var(--b3));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 var(--b4),0 12px 18px -4px rgba(0,50,90,.6)}
.fab .ic{width:26px;height:26px}
.fab:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 1px 0 var(--b4),0 4px 8px -2px rgba(0,50,90,.5)}
.foot{border-top:0;box-shadow:0 -10px 20px -12px rgba(10,40,70,.45)}
.tot{border-radius:14px;background:linear-gradient(180deg,rgba(0,0,0,.09),rgba(0,0,0,.02));box-shadow:inset 0 2px 5px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.3)}
.dlg{border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 30px 60px -10px rgba(0,0,0,.6)}
.dlg h2{background:var(--g);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 var(--b4)}
input,select,textarea{border-radius:12px;box-shadow:inset 0 2px 5px rgba(0,0,0,.15)}
.acts button{border-radius:12px;background:var(--g);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 var(--b4),0 7px 10px -4px rgba(0,50,90,.45)}
.acts button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 var(--b4)}
.acts .gh{background:var(--card);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 var(--ln),0 6px 10px -5px rgba(0,0,0,.3)}
.acts .dg{background:var(--gr);color:#111;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 #c9574a,0 7px 10px -4px rgba(120,30,20,.5)}
.seg button{border-radius:12px;box-shadow:0 3px 0 var(--ln)}
.drawer{box-shadow:0 0 40px rgba(0,0,0,.5)}.drawer .hd{background:var(--g);box-shadow:0 5px 12px -4px rgba(0,50,90,.5)}
.lockscr .ic{width:60px;height:60px;color:var(--bar);filter:drop-shadow(0 4px 4px rgba(0,60,100,.4))}
.dlg .ic{width:1.1em;height:1.1em;margin-inline-end:4px}
#app{max-width:720px}
header{padding:8px 4px;gap:2px}
header h1{margin:0 4px}
.bar2{padding:8px 6px}
main{padding:0 6px 10px}
.row{padding:8px 6px;gap:5px;margin-bottom:10px}
.row .nm{font-size:17px}
.amt{min-width:58px;font-size:17px}
.badge{min-width:28px;padding:2px 6px}
.plus{width:34px;height:34px}
table{border-spacing:0 8px;margin-top:-2px}
th{padding:8px 4px}
td{padding:4px 3px}
td.d{font-size:11px;padding:4px 2px}
td.a span,td.b span{padding:12px 2px;font-size:19px}
.foot{padding:8px 6px;gap:8px}
.tot{padding:6px 10px}
.dlg{padding:12px}

#calc{position:fixed;z-index:35;width:250px;display:none;border-radius:18px;background:var(--card);color:var(--tx);direction:ltr;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 40px -8px rgba(0,0,0,.55),0 0 0 1px var(--ln);user-select:none;-webkit-user-select:none}
#calc .ch{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--g);color:#fff;border-radius:18px 18px 0 0;font-weight:700;cursor:grab;touch-action:none}
#calc .ch button{color:#fff;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
#calc .dp{padding:8px 12px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#calc .ex{font-size:24px;font-weight:700;word-break:break-all;line-height:1.2}
#calc .rs{font-size:15px;color:var(--mu);word-break:break-all;min-height:20px}
#calc .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:6px 10px 10px}
#calc .kg button{padding:11px 0;border-radius:10px;font-size:18px;font-weight:700;background:var(--card);border:1px solid var(--ln);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 var(--ln),0 6px 8px -5px rgba(0,0,0,.35)}
#calc .kg button:active,#calc .tl button:active{transform:translateY(3px);box-shadow:none}
#calc .kg .op{background:var(--g);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 var(--b4)}
#calc .kg .eq{background:var(--gr);color:#111;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 #c9574a}
#calc .kg .wd{grid-column:span 2}
#calc .tl{display:flex;gap:7px;padding:0 10px 10px}
#calc .tl button{flex:1;padding:8px 0;font-size:13px;font-weight:700;border-radius:10px;background:var(--bg);border:1px solid var(--ln)}
.calcb{border-radius:9px;width:34px;height:34px;margin:0 4px;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 rgba(0,0,0,.25)}
.row[data-id]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
td.a span,td.b span{padding:9px 2px;font-size:16px;font-weight:700;border-radius:7px}
td.n{font-size:13px}
td.d{font-size:11px}
th{font-size:15px;padding:7px 4px}
table{border-spacing:0 7px}
td.a span,td.b span{padding:6px 2px;font-size:14px;font-weight:700;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 rgba(0,0,0,.22),0 4px 6px -3px rgba(0,0,0,.35)}
td{padding:2px 3px}
td.n{font-size:12px}
td.d{font-size:10px}
th{font-size:13px;padding:5px 3px}
table{border-spacing:0 5px}
th{background:var(--bar);box-shadow:none;border-radius:4px!important;font-size:17px;padding:7px 4px}
td.a span,td.b span{box-shadow:none;border-radius:4px;font-size:16px;font-weight:700;padding:7px 2px}
td.b{border-radius:0}
.o span{background:#e9807a;color:#111}
.f span{background:#78c98e;color:#111}
td.d{font-size:12px;color:var(--tx);font-weight:500}
td.n{font-size:13px}
table{border-spacing:0 6px}
th{font-size:14px;padding:4px 3px}
td.a span,td.b span{font-size:14px;padding:4px 2px;border-radius:3px}
td{padding:1px 3px}
td.d{font-size:11px}
td.n{font-size:12px}
table{border-spacing:0 4px}
th{font-size:12px;padding:3px 2px}
td.a span,td.b span{font-size:12px;padding:3px 2px;border-radius:3px}
td{padding:1px 2px}
td.d{font-size:10px}
td.n{font-size:11px}
table{border-spacing:0 3px}
.lkcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.lkcard input{max-width:none;width:100%;text-align:center}
.lkh{margin:0;text-align:center;font-size:20px}
.lkp{margin:0;text-align:center;font-size:14px;color:var(--mu);line-height:1.8}
.lkhr{border:0;border-top:1px solid var(--ln);width:100%;margin:2px 0}
.lklink{color:var(--ac);font-weight:700;padding:8px;text-align:center}
.acts[style*="wrap"] button{flex:1 1 42%}
.dlg.cm{padding:10px;max-width:420px}
.mh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mt{flex:1;text-align:center;font-weight:700;color:#fff;background:var(--g);border-radius:10px;padding:10px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 var(--b4)}
.mhb{width:38px;height:38px;border-radius:10px;color:var(--ac);display:grid;place-items:center}
.fr2{display:flex;align-items:center;gap:8px;margin:8px 0}
.fr2 input{flex:1;min-width:0;height:44px;margin:0;text-align:center}
.fi{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ac);background:var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 var(--ln),0 5px 8px -3px rgba(0,0,0,.4)}
.fi:active{transform:translateY(2px);box-shadow:none}
.th{width:44px;height:44px;flex:none;border-radius:8px;overflow:hidden;padding:0;border:2px solid var(--ac)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.fcur{display:flex;align-items:center;gap:8px;margin:8px 0}
.fcur span{font-weight:700;font-size:16px;min-width:56px}
.cpill{flex:1;position:relative;background:var(--bg);border-radius:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.cpill select{width:100%;height:44px;margin:0;border:0;background:transparent;box-shadow:none;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;font-weight:700}
.cpill .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ac);pointer-events:none}
.fdate input{width:100%;height:44px;text-align:center;margin:8px 0}
.fbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.rb{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;padding:6px 2px}
.rb i{width:22px;height:22px;border-radius:50%;border:2px solid;display:inline-block;position:relative;flex:none}
.rb.on i{border-color:var(--on)}.rb.fr i{border-color:var(--fr)}
.rb.sel i::after{content:"";position:absolute;inset:3px;border-radius:50%}
.rb.on.sel i::after{background:var(--on)}.rb.fr.sel i::after{background:var(--fr)}
.sb{width:46px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--g);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 var(--b4),0 6px 8px -4px rgba(0,50,90,.5)}
.sb:active{transform:translateY(3px);box-shadow:none}
.sb.dgb{background:var(--gr);color:#111;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 0 #c9574a}
.po{display:flex;align-items:center;gap:12px;padding:10px 6px;font-size:17px;font-weight:600}
.po input{width:22px;height:22px;margin:0;box-shadow:none;accent-color:var(--ac)}
.cpill{position:relative;height:46px;display:flex;align-items:center;justify-content:center}
.cpill .cv{font-weight:700;font-size:17px;line-height:1.7;padding:0 40px;white-space:nowrap;text-align:center;overflow:visible}
.cpill select{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;font-size:16px}
.dov{animation:fIn .25s ease both}
.drawer{width:min(86vw,340px);background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:dIn .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes dIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.drawer .hd{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 22px) 14px 20px;font-size:inherit}
.hl{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px -2px rgba(0,0,0,.3);flex:none}
.hl .ic{width:26px;height:26px}
.ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ht b{font-size:19px}.ht small{font-size:12px;opacity:.85}
.drawer .hx{width:36px;height:36px;border-radius:50%;padding:0;border:0;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;flex:none;transition:background .15s}
.drawer .hx:active{background:rgba(255,255,255,.34)}
.hx .ic{width:20px;height:20px}
.mg{margin:16px 12px 0}
.ms{font-size:12px;font-weight:700;color:var(--mu);padding:0 8px 8px}
.mc{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.1),0 10px 18px -12px rgba(10,40,70,.45)}
.drawer .mi{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 14px;border:0;border-bottom:0;text-align:start;font-size:16px;transition:background .15s}
.drawer .mi+.mi{border-top:1px solid var(--ln)}
.drawer .mi:active{background:rgba(0,168,232,.12)}
.ri{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(0,168,232,.14);color:var(--ac);flex:none;transition:transform .15s}
.mi:active .ri{transform:scale(.9)}
.ri .ic{width:20px;height:20px}
.mx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mx b{font-weight:600;font-size:16px}

<script>
var KEY='ledger-app-v1';
var S={accounts:[],currencies:['محلي'],cur:'محلي',theme:'auto'};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.accounts)S=p}}catch(e){}
if(!S.trash)S.trash=[];
if(!S.labels)S.labels={on:'عليه',fr:'له'};
var locked=!!S.lock;
function bl(n){return n>0?S.labels.on:(n<0?S.labels.fr:'')}
var view='home',openId=null,q='',showSearch=false,modal=null,drawer=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذر الحفظ: المساحة ممتلئة')}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return (Math.round(n*100)/100).toString()}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowStr(d){return d+' '+new Date().toTimeString().slice(0,5)}
function bal(a){return a.entries.reduce(function(s,e){return s+(e.type==='on'?e.amt:-e.amt)},0)}
function sums(list){var on=0,fr=0;list.forEach(function(a){a.entries.forEach(function(e){if(e.type==='on')on+=e.amt;else fr+=e.amt})});return{on:on,fr:fr,net:on-fr}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}

var IC={menu:'M4 6h16M4 12h16M4 18h16',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.5-4.5',doc:'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6',users:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.5-3.5 3-5 6.5-5s6 1.5 6.5 5M17 11a3 3 0 1 0 0-6M18 15c2 .3 3.2 1.8 3.5 4',phone:'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',lock:'M6 11h12v10H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3',back:'M4 12h15M13 6l6 6-6 6',plus:'M12 5v14M5 12h14',chev:'M6 9l6 6 6-6',book:'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',save:'M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-7h8v7',share:'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4',undo:'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',x:'M6 6l12 12M18 6L6 18',calc:'M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c.6-4 4-6 8-6s7.4 2 8 6',camera:'M4 8h3l2-3h6l2 3h3v12H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',kbd:'M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M7 14h10',pencil:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4'};
function ic(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IC[n]+'"/></svg>'}
function render(){
  applyTheme();
  if(locked){document.getElementById('app').innerHTML=lockH();setTimeout(function(){var e=document.getElementById('lp');if(e)e.focus()},50);return}
  var h=view==='home'?home():acc();
  document.getElementById('app').innerHTML=h+(drawer?drawerH():'')+(modal?modalH():'');
  var si=document.getElementById('si');if(si&&showSearch&&document.activeElement!==si){si.focus()}
}
function home(){
  var list=S.accounts.filter(function(a){return a.cur===S.cur&&(!q||a.name.indexOf(q)>-1)});
  var t=sums(list);
  var rows=list.map(function(a){var b=bal(a),c=b>0?'on':(b<0?'fr':'');
    return '<div class="row" data-id="'+a.id+'"><button class="plus" aria-label="قيد جديد" onclick="openEntry(\''+a.id+'\')">'+ic('plus')+'</button>'+
    '<button class="nm" onclick="go(\''+a.id+'\')">'+esc(a.name)+'</button>'+
    '<span class="badge">'+a.entries.length+'</span><span class="amt '+c+'">'+fmt(Math.abs(b))+' <small>'+bl(b)+'</small></span>'+
    '<button class="chev '+c+'" aria-label="فتح" onclick="go(\''+a.id+'\')">'+ic('chev')+'</button></div>'}).join('');
  return '<header><button class="ib" aria-label="القائمة" onclick="drawer=true;render()">'+ic('menu')+'</button><h1>عام</h1>'+
   '<button class="ib" aria-label="سلة المحذوفات" onclick="modal={t:\'trash\'};render()">'+ic('trash')+(S.trash.length?'<small>'+S.trash.length+'</small>':'')+'</button>'+
   '<button class="ib calcb" aria-label="آلة حاسبة" onclick="toggleCalc()">'+ic('calc')+'</button>'+
   '<button class="ib" aria-label="بحث" onclick="showSearch=!showSearch;if(!showSearch)q=\'\';render()">'+ic('search')+'</button>'+
   '<button class="ib" aria-label="تصدير" onclick="doPrint()">'+ic('doc')+'</button></header>'+
   (showSearch?'<div style="padding:10px 12px 0"><input id="si" placeholder="ابحث باسم الحساب" value="'+esc(q)+'" oninput="q=this.value;renderList()"></div>':'')+
   '<div class="bar2"><span class="chip">العملة: '+esc(S.cur)+'</span><span class="cnt">'+ic('users')+' ('+list.length+')</span></div>'+
   '<main id="lst">'+(rows||'<div class="empty">لا توجد حسابات بعد.<br>اضغط الزر الأزرق لإضافة أول حساب.</div>')+'</main>'+
   '<div class="foot"><div class="tot"><div><span>'+(S.labels.on==='عليه'?'الإجمالي (عليه)':esc(S.labels.on))+': '+fmt(t.on)+'</span>'+(t.fr?'<span>'+esc(S.labels.fr)+': '+fmt(t.fr)+'</span>':'')+'</div><div><span>الرصيد: '+fmt(Math.abs(t.net))+' '+esc(S.cur)+' '+bl(t.net)+'</span></div></div>'+
   '<button class="fab" aria-label="إضافة حساب" onclick="openAcc()">'+ic('plus')+'</button></div>';
}
function renderList(){var s=document.getElementById('si');var pos=s.selectionStart;render();var n=document.getElementById('si');if(n){n.focus();n.setSelectionRange(pos,pos)}}
function acc(){
  var a=S.accounts.find(function(x){return x.id===openId});if(!a){view='home';return home()}
  var run=0,rows=a.entries.slice().sort(function(x,y){return x.date<y.date?-1:1}).map(function(e){
    run+=e.type==='on'?e.amt:-e.amt;return{e:e,r:run}}).reverse().map(function(o){
    var cl=o.e.type==='on'?'o':'f',rc=o.r>0?'o':'f';
    return '<tr onclick="openEntry(\''+a.id+'\',\''+o.e.id+'\')"><td class="d">'+esc(o.e.date)+'</td><td class="a '+cl+'"><span>'+fmt(o.e.amt)+'</span></td><td class="n">'+esc(o.e.note)+(o.e.img?' '+ic('camera'):'')+'</td><td class="b '+rc+'"><span>'+fmt(Math.abs(o.r))+'</span></td></tr>'}).join('');
  var t=sums([a]);
  return '<header><button class="ib" aria-label="رجوع" onclick="view=\'home\';render()">'+ic('back')+'</button><h1>'+esc(a.name)+'</h1>'+
   (a.phone?'<a class="ib" aria-label="اتصال" href="tel:'+esc(a.phone)+'" style="text-decoration:none">'+ic('phone')+'</a>':'')+
   '<button class="ib" aria-label="تصدير" onclick="doPrint()">'+ic('doc')+'</button>'+
   '<button class="ib" aria-label="حذف الحساب" onclick="modal={t:\'delacc\'};render()">'+ic('trash')+'</button><button class="ib calcb" aria-label="آلة حاسبة" onclick="toggleCalc()">'+ic('calc')+'</button></header>'+
   '<main><table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>التفاصيل</th><th>الرصيد</th></tr></thead><tbody>'+rows+'</tbody></table></main>'+
   '<div class="foot"><div class="tot"><div><span>'+(S.labels.on==='عليه'?'الإجمالي':esc(S.labels.on))+': '+fmt(t.on)+'</span>'+(t.fr?'<span>'+esc(S.labels.fr)+': '+fmt(t.fr)+'</span>':'')+'</div><div><span>الرصيد: '+fmt(Math.abs(t.net))+' '+esc(a.cur)+' '+bl(t.net)+'</span></div></div>'+
   '<button class="fab" aria-label="قيد جديد" onclick="openEntry(\''+a.id+'\')">'+ic('plus')+'</button></div>';
}
function go(id){openId=id;view='acc';render();window.scrollTo(0,0)}
function doPrint(){modal={t:'rep'};render()}
function mk(t,cur){var l=[(S.labels.on==='عليه'?'الإجمالي عليه':S.labels.on)+': '+fmt(t.on)];if(t.fr)l.push(S.labels.fr+': '+fmt(t.fr));l.push('الرصيد: '+fmt(Math.abs(t.net))+' '+cur+' '+bl(t.net));return l}
function repData(){
 var rows=[];
 if(view==='acc'){var a=S.accounts.find(function(x){return x.id===openId});if(!a)return null;
  var run=0;rows=a.entries.slice().sort(function(x,y){return x.date<y.date?-1:1}).map(function(e){run+=e.type==='on'?e.amt:-e.amt;
   return{c:[e.date,fmt(e.amt),e.type==='on'?S.labels.on:S.labels.fr,e.note||'',fmt(Math.abs(run))+' '+bl(run)],k:[0,e.type,0,0,run>0?'on':'fr']}});
  return{title:a.name,sub:'العملة: '+a.cur+'   |   '+today(),cols:[{t:'التاريخ',w:290,al:'c'},{t:'المبلغ',w:190,al:'c'},{t:'النوع',w:140,al:'c'},{t:'التفاصيل',w:310,al:'r'},{t:'الرصيد',w:190,al:'c'}],rows:rows,tot:mk(sums([a]),a.cur)}}
 var list=S.accounts.filter(function(a){return a.cur===S.cur});
 rows=list.map(function(a){var b=bal(a);return{c:[a.name,String(a.entries.length),fmt(Math.abs(b))+' '+bl(b)],k:[0,0,b>0?'on':(b<0?'fr':0)]}});
 return{title:'كشف الحسابات',sub:'العملة: '+S.cur+'   |   '+today(),cols:[{t:'الحساب',w:560,al:'r'},{t:'عدد القيود',w:200,al:'c'},{t:'الرصيد',w:360,al:'c'}],rows:rows,tot:mk(sums(list),S.cur)}
}
function makePdf(rep){
 var W=1240,H=1754,M=60,pages=[],cv,cx,y,FN='Tahoma, Arial, sans-serif';
 function np(){cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;cx=cv.getContext('2d');cx.scale(2,2);cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.direction='rtl';cx.textBaseline='middle';pages.push(cv);y=M}
 function tx(s,x,yy,al,col,f,mw){cx.font=f;cx.fillStyle=col;cx.textAlign=al;s=String(s);if(mw){while(s.length>1&&cx.measureText(s).width>mw)s=s.slice(0,-1)}cx.fillText(s,x,yy)}
 function head(){var x=W-M;cx.fillStyle='#0a8fc4';cx.fillRect(M,y,W-2*M,64);rep.cols.forEach(function(c){tx(c.t,c.al==='c'?x-c.w/2:x-14,y+32,c.al==='c'?'center':'right','#fff','bold 28px '+FN);x-=c.w});y+=72}
 np();
 tx(rep.title,W-M,y+30,'right','#17212b','bold 46px '+FN);y+=70;
 tx(rep.sub,W-M,y+14,'right','#6b7885','26px '+FN);y+=50;
 head();
 rep.rows.forEach(function(r,i){if(y>H-M-70){np();head()}
  if(i%2===0){cx.fillStyle='#f1f5f7';cx.fillRect(M,y,W-2*M,56)}
  var x=W-M;
  rep.cols.forEach(function(c,j){var k=r.k[j],col=k==='on'?'#c0392b':(k==='fr'?'#1e8e5a':'#17212b');
   tx(r.c[j],c.al==='c'?x-c.w/2:x-14,y+28,c.al==='c'?'center':'right',col,'26px '+FN,c.w-24);x-=c.w});y+=56});
 if(!rep.rows.length){tx('لا توجد قيود',W/2,y+40,'center','#6b7885','28px '+FN);y+=80}
 y+=24;if(y>H-M-220)np();
 cx.fillStyle='#e6edf1';cx.fillRect(M,y,W-2*M,rep.tot.length*50+30);
 rep.tot.forEach(function(l,i){tx(l,W-M-20,y+40+i*50,'right','#17212b','bold 30px '+FN)});
 var jp=pages.map(function(c){var b=atob(c.toDataURL('image/jpeg',0.92).split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u});
 var enc=new TextEncoder(),parts=[],off=0,xr=[];
 function add(s){var b=typeof s==='string'?enc.encode(s):s;parts.push(b);off+=b.length}
 function ob(n,s){xr[n]=off;add(n+' 0 obj\n'+s+'\nendobj\n')}
 add('%PDF-1.4\n');
 var N=jp.length,kids=[],i;for(i=0;i<N;i++)kids.push((3+3*i)+' 0 R');
 ob(1,'<< /Type /Catalog /Pages 2 0 R >>');
 ob(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>');
 for(i=0;i<N;i++){var p=3+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
  ob(p,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>');
  ob(p+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  xr[p+2]=off;add((p+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W*2+' /Height '+H*2+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jp[i].length+' >>\nstream\n');add(jp[i]);add('\nendstream\nendobj\n')}
 var xo=off,T=3+3*N;
 add('xref\n0 '+T+'\n0000000000 65535 f \n');
 for(i=1;i<T;i++)add(String(xr[i]).padStart(10,'0')+' 00000 n \n');
 add('trailer\n<< /Size '+T+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'})
}
function savePdf(){var rep=repData();if(!rep)return;var blob;try{blob=makePdf(rep)}catch(e){toast('تعذر إنشاء الملف');return}openSave('report-'+today()+'.pdf',blob,false)}
function repText(r){var s=[r.title,r.sub,''];r.rows.forEach(function(x){s.push(x.c.filter(function(v){return v!==''}).join(' | '))});s.push('');return s.concat(r.tot).join('\n')}
function shareReport(){var rep=repData();if(!rep)return;var text=repText(rep),file=null;
 try{file=new File([makePdf(rep)],'report-'+today()+'.pdf',{type:'application/pdf'})}catch(e){}
 function fb(){var t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('تم نسخ التقرير، الصقه في أي تطبيق')}catch(e){toast('تعذرت المشاركة')}t.remove()}
 function tryText(){if(navigator.share){navigator.share({title:rep.title,text:text}).catch(function(e){if(!e||e.name!=='AbortError')fb()})}else fb()}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:rep.title}).catch(function(e){if(!e||e.name!=='AbortError')tryText()})}else tryText()}

function typeSeg(t){return '<div class="seg"><button class="s-on '+(t==='on'?'sel':'')+'" onclick="setT(\'on\')">'+esc(S.labels.on)+'</button><button class="s-fr '+(t==='fr'?'sel':'')+'" onclick="setT(\'fr\')">'+esc(S.labels.fr)+'</button></div>'}
function nrm(v){v=String(v).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-1776}).replace(/\u066B/g,'.').replace(/[^0-9.]/g,'');var p=v.split('.');return p.length>1?p[0]+'.'+p.slice(1).join(''):v}
function safeImg(u){return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u||'')?u:''}
function thumb(m){var u=m.img?safeImg(m.img):'';return u?'<button class="th" aria-label="الصورة" onclick="viewImg()"><img alt="" src="'+u+'"></button>':''}
function mhead(t){return '<div class="mh"><button class="mhb" aria-label="إغلاق" onclick="modal=null;render()">'+ic('back')+'</button><div class="mt">'+t+'</div><button class="mhb" aria-label="إخفاء لوحة المفاتيح" onclick="if(document.activeElement)document.activeElement.blur()">'+ic('kbd')+'</button></div>'}
function frow(icon,inner,fn){return '<div class="fr2"><button class="fi" '+(fn?'onclick="'+fn+'"':'tabindex="-1"')+'>'+ic(icon)+'</button>'+inner+'</div>'}
function rdBar(m,acc){var h='<div class="fbar"><button class="rb on'+(m.type==='on'?' sel':'')+'" data-t="on" onclick="setT(\'on\')"><i></i>'+esc(S.labels.on)+'</button><button class="rb fr'+(m.type==='fr'?' sel':'')+'" data-t="fr" onclick="setT(\'fr\')"><i></i>'+esc(S.labels.fr)+'</button><span style="flex:1"></span>';
 if(m.eid)h+='<button class="sb dgb" aria-label="حذف" onclick="delEnt()">'+ic('trash')+'</button>';else h+='<button class="sb" aria-label="حفظ وإضافة آخر" onclick="'+(acc?'saveAcc(true)':'saveEnt(true)')+'">'+ic('plus')+'</button>';
 return h+'<button class="sb" aria-label="حفظ" onclick="'+(acc?'saveAcc()':'saveEnt()')+'">'+ic('save')+'</button></div>'}
function compressImg(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7))};im.onerror=function(){toast('تعذر قراءة الصورة')};im.src=fr.result};fr.onerror=function(){toast('تعذر قراءة الصورة')};fr.readAsDataURL(file)}
function openPhoto(){keep();var d=document.createElement('div');d.id='phsel';d.className='ov';d.style.zIndex=55;
 d.innerHTML='<div class="dlg cm"><div class="mh"><div class="mt">خيارات الصورة</div></div><label class="po"><input type="radio" name="ph" value="cam" checked>الكاميرا</label><label class="po"><input type="radio" name="ph" value="gal">الهاتف</label><div class="acts"><button id="ph_ok">موافق</button><button class="gh" id="ph_no">إلغاء</button></div></div>';
 document.body.appendChild(d);
 document.getElementById('ph_no').onclick=function(){d.remove()};
 document.getElementById('ph_ok').onclick=function(){var v=d.querySelector('input[name=ph]:checked').value;d.remove();
